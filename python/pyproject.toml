[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "sanadb"
version = "0.2.1"
description = "Disk-first embedded vector + metadata store"
readme = "../README.md"
license = { text = "MIT OR Apache-2.0" }
requires-python = ">=3.9"
dependencies = ["numpy>=1.20"]
classifiers = [
  "Programming Language :: Rust",
  "Programming Language :: Python :: 3",
  "Topic :: Database",
]

[project.urls]
Repository = "https://github.com/RohithOrg/sanadb"

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "sanadb"
