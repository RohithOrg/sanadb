[package]
name = "sanadb-studio"
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
description = "Local web UI for a sanadb store: browse, search, map, watch the walk, edit metadata"
license = "MIT OR Apache-2.0"
repository = "https://github.com/RohithOrg/sanadb"
publish = false

[[bin]]
name = "sanadb-studio"
path = "src/main.rs"

[dependencies]
sanadb = { path = "..", version = "0.2.0" }
tiny_http = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
