name: Release

# Tag `vX.Y.Z` to publish the crate to crates.io and wheels + sdist to PyPI.
# Secrets: CARGO_REGISTRY_TOKEN (crates.io) and PYPI_API_TOKEN (PyPI, scoped
# to both `sanadb` and `sanadb-studio`). Trusted publishing was used until
# 0.2.2; from 0.2.3 PyPI refused the minted token for `sanadb`, so the
# upload uses a token.
#
# "Run workflow" with an existing tag re-runs a release from this file as it
# is on master, against the code at that tag: crates already on crates.io
# are skipped, so a publish that failed half-way can be finished.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "existing tag to (re)publish, e.g. v0.2.4"
        required: true

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  check:
    name: Tag matches versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - name: Compare tag with Cargo.toml and pyproject.toml
        run: |
          tag="${TAG#v}"
          crate=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)"/\1/')
          py=$(grep -m1 '^version' python/pyproject.toml | sed 's/.*"\(.*\)"/\1/')
          st=$(grep -m1 '^version' studio/pyproject.toml | sed 's/.*"\(.*\)"/\1/')
          echo "tag=$tag crate=$crate python=$py studio=$st"
          test "$tag" = "$crate" && test "$tag" = "$py" && test "$tag" = "$st"

  crate:
    name: crates.io
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish unless this version is already on crates.io
        run: |
          v="${TAG#v}"
          if curl -sf -A "sanadb-release (github actions)" "https://crates.io/api/v1/crates/sanadb/$v" > /dev/null; then
            echo "sanadb $v is already published"; exit 0
          fi
          cargo publish -p sanadb
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  studio-crate:
    name: crates.io (studio)
    needs: crate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish once the core crate is visible in the index
        run: |
          v="${TAG#v}"
          if curl -sf -A "sanadb-release (github actions)" "https://crates.io/api/v1/crates/sanadb-studio/$v" > /dev/null; then
            echo "sanadb-studio $v is already published"; exit 0
          fi
          for i in $(seq 1 12); do
            cargo publish -p sanadb-studio && exit 0
            echo "retry $i in 30 s"; sleep 30
          done
          exit 1
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  studio-binaries:
    name: studio ${{ matrix.target }}
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-15-intel, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release -p sanadb-studio
      - name: Package
        shell: bash
        run: |
          v="${TAG#v}"
          mkdir -p out
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/release/sanadb-studio.exe out/
            (cd out && 7z a "../sanadb-studio-$v-${{ matrix.target }}.zip" sanadb-studio.exe > /dev/null)
          else
            cp target/release/sanadb-studio out/
            tar -C out -czf "sanadb-studio-$v-${{ matrix.target }}.tar.gz" sanadb-studio
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: studio-${{ matrix.target }}
          path: sanadb-studio-*

  wheels:
    name: wheel ${{ matrix.os }} ${{ matrix.target }}
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64, manylinux: auto }
          - { os: ubuntu-latest, target: aarch64, manylinux: "2_28" }
          - { os: ubuntu-latest, target: x86_64, manylinux: musllinux_1_2 }
          - { os: ubuntu-latest, target: aarch64, manylinux: musllinux_1_2 }
          # Both macOS wheels on the Intel runner: GitHub's arm64 macOS runners
          # have cancelled queued jobs for lack of capacity; maturin cross-compiles.
          - { os: macos-15-intel, target: aarch64 }
          - { os: macos-15-intel, target: x86_64 }
          - { os: windows-latest, target: x64 }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: python
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist
          sccache: "true"
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}-${{ matrix.manylinux || 'native' }}
          path: python/dist
      # The studio binary as its own wheel (`pip install "sanadb[studio]"`).
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: studio
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist
          sccache: "true"
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-studio-${{ matrix.os }}-${{ matrix.target }}-${{ matrix.manylinux || 'native' }}
          path: studio/dist

  sdist:
    name: sdist
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: python
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: python/dist

  pypi:
    name: PyPI
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      # Two projects, two uploads, one token scoped to both.
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-[!s]*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-studio-*
          path: dist-studio
          merge-multiple: true
      - run: ls -la dist dist-studio
      - name: Publish sanadb
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
      - name: Publish sanadb-studio
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-studio
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true

  github-release:
    name: GitHub release
    needs: [crate, pypi, studio-binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/download-artifact@v4
        with:
          pattern: studio-*
          path: bins
          merge-multiple: true
      - name: Extract this version's section from CHANGELOG.md
        run: |
          v="${TAG#v}"
          awk -v v="$v" '
            /^## \[/ { on = index($0, "[" v "]") > 0; if (on) next }
            on { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || echo "See CHANGELOG.md." > notes.md
          cat notes.md
      - name: Create the release, or add the binaries if it already exists
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" bins/* --clobber
          else
            gh release create "$TAG" --title "sanadb $TAG" --notes-file notes.md bins/*
          fi
        env:
          GH_TOKEN: ${{ github.token }}
