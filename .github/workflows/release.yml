name: Release

# Tag `vX.Y.Z` to publish the crate to crates.io and wheels + sdist to PyPI.
# Secrets: CARGO_REGISTRY_TOKEN (crates.io). PyPI uses trusted publishing
# (OIDC, no token), which also attaches build provenance to every file:
# both projects, `sanadb` and `sanadb-studio`, carry the identical
# publisher (this repository, `release.yml`, environment `pypi`). The
# environment must match on both: 0.2.3 to 0.2.5 failed or went up without
# provenance because one project's publisher said "any environment", which
# PyPI treats as a different publisher and then scopes the token to the
# other project only.
#
# A tag push releases everything. "Run workflow" takes an existing tag and
# four switches, so one part can be released or re-released on its own:
# crates (sanadb and sanadb-studio on crates.io), python (wheels, sdist,
# the two PyPI packages), studio (the prebuilt binaries and the GitHub
# release that carries them), docs (the site). It runs this file as it is
# on master against the code at that tag; crates and files already
# published are skipped, so a publish that failed half-way can be
# finished. The three version numbers always move together (the studio
# crate and the Python extra pin the core version), so a partial release
# still carries the tag's version.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "existing tag to (re)publish, e.g. v0.2.4"
        required: true
      crates:
        description: "publish sanadb and sanadb-studio to crates.io"
        type: boolean
        default: true
      python:
        description: "build wheels and sdist, publish both packages to PyPI"
        type: boolean
        default: true
      studio:
        description: "build the studio binaries and create the GitHub release"
        type: boolean
        default: true
      docs:
        description: "deploy the documentation site"
        type: boolean
        default: true

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  check:
    name: Tag matches versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - name: Compare tag with Cargo.toml and pyproject.toml
        run: |
          tag="${TAG#v}"
          crate=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)"/\1/')
          py=$(grep -m1 '^version' python/pyproject.toml | sed 's/.*"\(.*\)"/\1/')
          st=$(grep -m1 '^version' studio/pyproject.toml | sed 's/.*"\(.*\)"/\1/')
          echo "tag=$tag crate=$crate python=$py studio=$st"
          test "$tag" = "$crate" && test "$tag" = "$py" && test "$tag" = "$st"

  crate:
    name: crates.io
    needs: check
    if: github.event_name == 'push' || inputs.crates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish unless this version is already on crates.io
        run: |
          v="${TAG#v}"
          if curl -sf -A "sanadb-release (github actions)" "https://crates.io/api/v1/crates/sanadb/$v" > /dev/null; then
            echo "sanadb $v is already published"; exit 0
          fi
          cargo publish -p sanadb
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  studio-crate:
    name: crates.io (studio)
    needs: crate
    if: github.event_name == 'push' || inputs.crates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish once the core crate is visible in the index
        run: |
          v="${TAG#v}"
          if curl -sf -A "sanadb-release (github actions)" "https://crates.io/api/v1/crates/sanadb-studio/$v" > /dev/null; then
            echo "sanadb-studio $v is already published"; exit 0
          fi
          for i in $(seq 1 12); do
            cargo publish -p sanadb-studio && exit 0
            echo "retry $i in 30 s"; sleep 30
          done
          exit 1
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  studio-binaries:
    name: studio ${{ matrix.target }}
    needs: check
    if: github.event_name == 'push' || inputs.studio
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-15-intel, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release -p sanadb-studio
      - name: Package
        shell: bash
        run: |
          v="${TAG#v}"
          mkdir -p out
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/release/sanadb-studio.exe out/
            (cd out && 7z a "../sanadb-studio-$v-${{ matrix.target }}.zip" sanadb-studio.exe > /dev/null)
          else
            cp target/release/sanadb-studio out/
            tar -C out -czf "sanadb-studio-$v-${{ matrix.target }}.tar.gz" sanadb-studio
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: studio-${{ matrix.target }}
          path: sanadb-studio-*

  wheels:
    name: wheel ${{ matrix.os }} ${{ matrix.target }}
    needs: check
    if: github.event_name == 'push' || inputs.python
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64, manylinux: auto }
          - { os: ubuntu-latest, target: aarch64, manylinux: "2_28" }
          - { os: ubuntu-latest, target: x86_64, manylinux: musllinux_1_2 }
          - { os: ubuntu-latest, target: aarch64, manylinux: musllinux_1_2 }
          # Both macOS wheels on the Intel runner: GitHub's arm64 macOS runners
          # have cancelled queued jobs for lack of capacity; maturin cross-compiles.
          - { os: macos-15-intel, target: aarch64 }
          - { os: macos-15-intel, target: x86_64 }
          - { os: windows-latest, target: x64 }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: python
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist
          sccache: "true"
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}-${{ matrix.manylinux || 'native' }}
          path: python/dist
      # The studio binary as its own wheel (`pip install "sanadb[studio]"`).
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: studio
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist
          sccache: "true"
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-studio-${{ matrix.os }}-${{ matrix.target }}-${{ matrix.manylinux || 'native' }}
          path: studio/dist

  sdist:
    name: sdist
    needs: check
    if: github.event_name == 'push' || inputs.python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: python
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: python/dist

  pypi:
    name: PyPI
    needs: [wheels, sdist]
    if: github.event_name == 'push' || inputs.python
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      # Two projects, two uploads: one per project keeps each upload's
      # provenance attached to the right project.
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-[!s]*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-studio-*
          path: dist-studio
          merge-multiple: true
      - run: ls -la dist dist-studio
      - name: Publish sanadb
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true
      - name: Publish sanadb-studio
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-studio
          skip-existing: true

  github-release:
    name: GitHub release
    needs: [crate, pypi, studio-binaries]
    # Runs when the studio part is on and nothing that did run failed;
    # skipped parts (crates or python off) do not hold it back.
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && (github.event_name == 'push' || inputs.studio) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/download-artifact@v4
        with:
          pattern: studio-*
          path: bins
          merge-multiple: true
      - name: Extract this version's section from CHANGELOG.md
        run: |
          v="${TAG#v}"
          awk -v v="$v" '
            /^## \[/ { on = index($0, "[" v "]") > 0; if (on) next }
            on { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || echo "See CHANGELOG.md." > notes.md
          cat notes.md
      - name: Create the release, or add the binaries if it already exists
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" bins/* --clobber
          else
            gh release create "$TAG" --title "sanadb $TAG" --notes-file notes.md bins/*
          fi
        env:
          GH_TOKEN: ${{ github.token }}

  docs:
    name: Docs
    needs: check
    if: github.event_name == 'push' || inputs.docs
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      # The site is built by docs.yml from master (README, CHANGELOG and
      # docs/ as they are now); this just asks for a deploy.
      - run: gh workflow run Docs --repo "$GITHUB_REPOSITORY" --ref master
        env:
          GH_TOKEN: ${{ github.token }}
