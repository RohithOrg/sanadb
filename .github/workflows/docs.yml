name: Docs

# Publishes docs/ (plus README and CHANGELOG) as a MkDocs site on GitHub
# Pages. One-time setup: repository Settings -> Pages -> Source: GitHub Actions.

on:
  push:
    branches: [master]
    paths: ["docs/**", "README.md", "CHANGELOG.md", "mkdocs.yml", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet mkdocs-material
      - name: Bring README and CHANGELOG into the site
        run: |
          sed 's#](docs/#](#g' README.md > docs/index.md
          cp CHANGELOG.md docs/CHANGELOG.md
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
