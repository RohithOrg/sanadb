site_name: sanadb
site_description: Disk-first embedded vector + metadata store
repo_url: https://github.com/RohithOrg/sanadb
docs_dir: docs
theme:
  name: material
  palette:
    - scheme: default
      toggle: { icon: material/brightness-7, name: Dark }
    - scheme: slate
      toggle: { icon: material/brightness-4, name: Light }
  features: [navigation.sections, content.code.copy]
markdown_extensions:
  - tables
  - toc
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
nav:
  - Overview: index.md
  - Python:
      - Getting started: python/getting-started.md
      - API: python/api.md
      - Examples: python/examples.md
      - Recipes: python/recipes.md
  - Rust:
      - Getting started: rust/getting-started.md
      - API: rust/api.md
      - Examples: rust/examples.md
      - Recipes: rust/recipes.md
  - Studio: studio.md
  - How it works: architecture.md
  - Operating a store: operations.md
  - Failure modes: failure-modes.md
  - Benchmarks: benchmarks.md
  - File format: FORMAT.md
  - Compared with the alternatives: compare.md
  - Status, limits and roadmap: roadmap.md
  - 104 questions, answered: questions.md
  - Design notes:
      - Snapshot and tail: design/snapshot-and-tail.md
      - Typed metadata and filtered search: design/typed-metadata-and-filtered-search.md
      - Hybrid search: design/hybrid-search.md
  - Changelog: CHANGELOG.md
not_in_nav: |
  rust/README.md
