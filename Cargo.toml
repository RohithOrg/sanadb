[workspace]
members = [".", "python"]

[package]
name = "sanadb"
version = "0.1.2"
edition = "2024"
rust-version = "1.89"
description = "Disk-first embedded vector + metadata store: write-ahead log, memory-mapped DiskANN-style graph index, product quantization, metadata filters"
license = "MIT OR Apache-2.0"
repository = "https://github.com/RohithOrg/sanadb"
readme = "README.md"
keywords = ["vector", "database", "embedded", "ann", "search"]
categories = ["database-implementations", "data-structures"]
exclude = ["/python", "/data", "/.github"]

[dependencies]
crc32fast = "1"
memmap2 = "0.9"
bytemuck = "1"
rayon = "1"
parking_lot = "0.12"

[dev-dependencies]
criterion = "0.5"
tempfile = "3"
rand = "0.8"

[[bench]]
name = "search"
harness = false

[profile.release]
debug = 1
